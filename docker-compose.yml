services:
  hadoop:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hadoop-single-node
    hostname: hadoop

    ports:
      - "9870:9870"
      - "9000:9000"
      - "9864:9864"
      - "8088:8088"

    volumes:
      - ./datasets/raw/citibike/2024:/data/citibike/2024:ro
      - namenode_data:/opt/hadoop/data/namenode
      - datanode_data:/opt/hadoop/data/datanode
      - ./logs/hadoop:/var/log/hadoop

    mem_limit: 5g
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: citibike-postgres
    hostname: postgres

    environment:
      POSTGRES_DB: citibike
      POSTGRES_USER: citibike
      POSTGRES_PASSWORD: citibike_dev_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./datasets/raw/citibike/2024:/data/citibike/2024:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citibike -d citibike"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  flume:
    build:
      context: .
      dockerfile: Dockerfile.flume

    image: citibike-flume:1.11.0
    container_name: citibike-flume
    hostname: flume

    depends_on:
      - hadoop

    volumes:
      # Read Hadoop operational logs
      - ./logs/hadoop:/var/log/hadoop:ro

      # Flume Agent configuration
      - ./config/flume/flume.conf:/opt/flume/conf/flume.conf:ro

      # Hadoop client configuration
      - ./config/flume/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/flume/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

      # Persistent Flume state
      - flume_data:/var/lib/flume

    mem_limit: 1g
    restart: unless-stopped

  hive-metastore:
    image: citibike-hive:4.1.0
    container_name: citibike-hive-metastore
    hostname: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      hadoop:
        condition: service_started
    command: >
      bash -c "schematool -dbType postgres -info &&
      hive --service metastore"
    ports:
      - "9083:9083"
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hive/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    mem_limit: 1g
    restart: unless-stopped

  hiveserver2:
    image: citibike-hive:4.1.0
    container_name: citibike-hiveserver2
    hostname: hiveserver2

    environment:
      HADOOP_HEAPSIZE: "1024"

    depends_on:
      - hive-metastore
    command: >
      hive --service hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hive/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    mem_limit: 2g
    restart: unless-stopped

  pig:
    image: citibike-pig:0.18.0
    container_name: citibike-pig
    hostname: pig

    depends_on:
      - hadoop

    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      PIG_HOME: /opt/pig

    command: ["bash", "-lc", "sleep infinity"]

    volumes:
      - ./config/pig/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/pig/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/pig/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/pig/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro

    mem_limit: 2g
    restart: unless-stopped

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  flume_data:
