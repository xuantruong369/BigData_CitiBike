services:
  hadoop:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hadoop-single-node
    hostname: hadoop

    ports:
      - "9870:9870"
      - "9000:9000"
      - "9864:9864"
      - "8088:8088"

    volumes:
      - ./datasets/raw/citibike/2024:/data/citibike/2024:ro
      - namenode_data:/opt/hadoop/data/namenode
      - datanode_data:/opt/hadoop/data/datanode

    mem_limit: 5g
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: citibike-postgres
    hostname: postgres

    environment:
      POSTGRES_DB: citibike
      POSTGRES_USER: citibike
      POSTGRES_PASSWORD: citibike_dev_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./datasets/raw/citibike/2024:/data/citibike/2024:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citibike -d citibike"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
