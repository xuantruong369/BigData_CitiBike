# ==========================================
# Flume Agent: citibike
# Collect real Hadoop operational logs
# ==========================================

citibike.sources = hadoop_logs
citibike.channels = file_channel
citibike.sinks = hdfs_sink

# ==========================================
# SOURCE: Taildir
# ==========================================

citibike.sources.hadoop_logs.type = TAILDIR
citibike.sources.hadoop_logs.positionFile = /var/lib/flume/taildir/position.json

citibike.sources.hadoop_logs.filegroups = hadoop
citibike.sources.hadoop_logs.filegroups.hadoop = /var/log/hadoop/hadoop-hadoop-(namenode|datanode|resourcemanager|nodemanager)-hadoop\.out$

citibike.sources.hadoop_logs.batchSize = 1000
citibike.sources.hadoop_logs.skipToEnd = false

# ==========================================
# CHANNEL: File Channel
# ==========================================

citibike.channels.file_channel.type = file
citibike.channels.file_channel.checkpointDir = /var/lib/flume/checkpoint
citibike.channels.file_channel.dataDirs = /var/lib/flume/data

citibike.channels.file_channel.capacity = 1000000
citibike.channels.file_channel.transactionCapacity = 1000

# ==========================================
# SINK: HDFS
# ==========================================

citibike.sinks.hdfs_sink.type = hdfs
citibike.sinks.hdfs_sink.hdfs.path = hdfs://hadoop:9000/citibike/flume/logs/%Y/%m/%d/

citibike.sinks.hdfs_sink.hdfs.fileType = DataStream
citibike.sinks.hdfs_sink.hdfs.writeFormat = Text
citibike.sinks.hdfs_sink.hdfs.useLocalTimeStamp = true

citibike.sinks.hdfs_sink.hdfs.rollInterval = 60
citibike.sinks.hdfs_sink.hdfs.rollSize = 134217728
citibike.sinks.hdfs_sink.hdfs.rollCount = 0

citibike.sinks.hdfs_sink.hdfs.batchSize = 1000
citibike.sinks.hdfs_sink.hdfs.callTimeout = 30000

# ==========================================
# Bind Source, Channel and Sink
# ==========================================

citibike.sources.hadoop_logs.channels = file_channel
citibike.sinks.hdfs_sink.channel = file_channel
